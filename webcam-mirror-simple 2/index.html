<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webcam Mirror</title>
  <style>
:root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10141c; color: #eef2fa; }
body { margin: 0; padding: 32px 16px; }
main { max-width: 900px; margin: auto; }
h1 { margin-bottom: 8px; }
p { color: #b8c4d9; line-height: 1.5; }
.preview { position: relative; background: #06090e; border: 1px solid #344158; border-radius: 16px; overflow: hidden; }
video { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; transform: scaleX(-1); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }
.controls { display: flex; gap: 12px; margin-top: 20px; }
button { font: inherit; padding: 12px 18px; border: 1px solid #52627c; border-radius: 8px; background: #24344e; color: white; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible { outline: 3px solid #99c6ff; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <h1>Webcam Mirror</h1>
    <p>Your camera, reflected, with facial landmark dots. Video stays on your device.</p>
    <div class="preview">
      <video id="video" autoplay muted playsinline aria-label="Mirrored webcam preview"></video>
      <canvas id="landmarks" aria-hidden="true"></canvas>
    </div>
    <div class="controls">
      <button id="start" type="button">Start camera</button>
      <button id="stop" type="button" disabled>Stop camera</button>
    </div>
    <p id="status" role="status" aria-live="polite">Camera is off.</p>
  </main>
<script>
const video = document.querySelector('#video');
const startButton = document.querySelector('#start');
const stopButton = document.querySelector('#stop');
const status = document.querySelector('#status');
let stream = null;
let requestId = 0;
const canvas = document.querySelector('#landmarks');
const context = canvas.getContext('2d');
let landmarkerPromise = null;
let animationId = null;
let lastVideoTime = -1;

// Pin the JavaScript and WASM to the same version.
async function loadLandmarker() {
  if (!landmarkerPromise) {
    landmarkerPromise = (async () => {
      const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21';
      const { FaceLandmarker, FilesetResolver } = await import(`${base}/vision_bundle.mjs`);
      const vision = await FilesetResolver.forVisionTasks(`${base}/wasm`);
      const options = {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
          delegate: 'GPU'
        },
        runningMode: 'VIDEO',
        numFaces: 1
      };
      try {
        return await FaceLandmarker.createFromOptions(vision, options);
      } catch {
        options.baseOptions.delegate = 'CPU';
        return await FaceLandmarker.createFromOptions(vision, options);
      }
    })().catch(error => {
      landmarkerPromise = null;
      throw error;
    });
  }
  return landmarkerPromise;
}

function trackFace(landmarker, currentRequest) {
  if (currentRequest !== requestId || !stream) return;
  try {
    if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }
      const result = landmarker.detectForVideo(video, performance.now());
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = '#62ffb4';
      // Both video and canvas are mirrored in CSS, keeping dots aligned.
      const radius = Math.max(1.5, canvas.width / 500);
      let count = 0;
      for (const face of result.faceLandmarks) {
        for (const point of face) {
          context.beginPath();
          context.arc(point.x * canvas.width, point.y * canvas.height, radius, 0, Math.PI * 2);
          context.fill();
          count++;
        }
      }
      status.textContent = count ? `${count} facial landmarks detected.` : 'Camera is on. Looking for a face…';
    }
    animationId = requestAnimationFrame(() => trackFace(landmarker, currentRequest));
  } catch {
    stopCamera('Face tracking failed. Press Start camera to retry.');
  }
}

function stopCamera(message = 'Camera is off.') {
  requestId++;
  cancelAnimationFrame(animationId);
  animationId = null;
  lastVideoTime = -1;
  context.clearRect(0, 0, canvas.width, canvas.height);
  if (stream) stream.getTracks().forEach(track => track.stop());
  stream = null;
  video.srcObject = null;
  startButton.disabled = false;
  stopButton.disabled = true;
  status.textContent = message;
}

async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    status.textContent = 'Camera access requires HTTPS or localhost and a supported browser.';
    return;
  }

  const currentRequest = ++requestId;
  startButton.disabled = true;
  stopButton.disabled = false;
  status.textContent = 'Allow camera access in your browser…';

  try {
    const camera = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    // Discard a permission request that completed after Stop or navigation.
    if (currentRequest !== requestId) {
      camera.getTracks().forEach(track => track.stop());
      return;
    }
    stream = camera;
    video.srcObject = camera;
    camera.getVideoTracks()[0].addEventListener('ended', () => {
      if (stream === camera) stopCamera('Camera disconnected. Press Start camera to retry.');
    });
    await video.play();
    if (currentRequest !== requestId) return;
    video.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
    status.textContent = 'Loading face tracking model…';
    let landmarker;
    try {
      landmarker = await loadLandmarker();
    } catch {
      if (currentRequest === requestId) {
        stopCamera('Could not load MediaPipe. Check your internet connection and press Start camera to retry.');
      }
      return;
    }
    if (currentRequest !== requestId) return;
    trackFace(landmarker, currentRequest);
  } catch (error) {
    if (currentRequest !== requestId) return;
    const messages = {
      NotAllowedError: 'Camera permission denied. Allow camera access in your browser and try again.',
      NotFoundError: 'No camera found. Connect a camera and try again.',
      NotReadableError: 'Camera unavailable. Close other apps using it and try again.'
    };
    stopCamera(messages[error.name] || 'Could not start the camera. Please try again.');
  }
}

startButton.addEventListener('click', startCamera);
stopButton.addEventListener('click', () => stopCamera());
window.addEventListener('pagehide', () => stopCamera());
</script>
</body>
</html>
